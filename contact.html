<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
  </head>
  <body>
    <!-- header including -->
    <header id="header-container"></header>
    <!-- head text -->
    <section class="contact-head-text">
      <h1>Get In <span>Touch</span></h1>
      <p>We'd love to hear feedback from you to help us improve our work</p>
    </section>
    <!-- start contact main section -->
    <main class="contact-main">
      <!-- left side -->
      <div class="contact-main-left">
        <div class="contact-card">
          <img src="" alt="location-logo" />
          <h1>Address</h1>
          <p>Helwan University, Faculty of Engineering</p>
        </div>
        <div class="contact-card">
          <img src="" alt="email-logo" />
          <h1>Email</h1>
          <p>email@FEHU.com</p>
        </div>
        <div class="contact-card">
          <img src="" alt="phone-logo" />
          <h1>Phone</h1>
          <p>+20 123-4567-8910</p>
        </div>
      </div>
      <div class="contact-refer-icons">
        <a href="">Google</a>
        <a href="">Reddit</a>
        <a href="">Linkedin</a>
      </div>
      <!-- right side -->
      <form action="" class="contact-main-right">
        <h1>Send a Message</h1>
        <input type="text" name="name" placeholder="Full Name" />
        <input type="email" name="email" placeholder="E-Mail" />
        <input type="text" name="subject" placeholder="Subject" />
        <textarea name="Message">Message</textarea>
        <input type="submit" value="Send Message" />
      </form>
    </main>
    <!-- end contact main section -->
    <!-- footer including -->
    <footer id="footer-container"></footer>
  </body>
</html>
