<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/contact.css" />
    <!-- for responsive design -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
    <!-- standard variables and style options for the entire project -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <!-- for the footer and header to work -->
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <!-- for the icons -->
    <link rel="stylesheet" href="Css/all.min.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Contact</title>
  </head>
  <body>
    <!-- header including -->
    <header id="header-container"></header>
    <!-- head text -->
    <section class="contact-head-text">
      <h1>Get In <span>Touch</span></h1>
      <p>We'd love to hear feedback from you to help us improve our work</p>
    </section>
    <!-- start contact main section -->
    <main class="contact-main">
      <!-- left side -->
      <div class="contact-main-left">
        <div class="contact-card">
          <i class="fa-solid fa-location-dot"></i>
          <div>
            <h1>Address</h1>
            <p>Helwan University, Faculty of Engineering</p>
          </div>
        </div>
        <div class="contact-card">
          <i class="fa-solid fa-envelope"></i>
          <div>
            <h1>Email</h1>
            <p>email@FEHU.com</p>
          </div>
        </div>
        <div class="contact-card">
          <i class="fa-solid fa-mobile"></i>
          <div>
            <h1>Phone</h1>
            <p>+20 123-4567-8910</p>
          </div>
        </div>
        <div class="contact-refer-icons">
          <a href="https://www.google.com/"
            ><i class="fa-brands fa-google"></i
          ></a>
          <a href="https://github.com/amrsaeed648/Edulearn.git">
            <i class="fa-brands fa-github"></i
          ></a>
          <a href="https://www.linkedin.com/"
            ><i class="fa-brands fa-linkedin-in"></i
          ></a>
        </div>
      </div>
      <!-- right side -->
      <div class="contact-main-right">
        <form action="">
          <h1>Send a Message</h1>
          <input type="text" name="name" placeholder="Full Name" maxlength="50" />
          <input type="email" name="email" placeholder="E-Mail" maxlength="50" />
          <input type="text" name="subject" placeholder="Subject" maxlength="50" />
          <textarea name="message" placeholder="Type your Message" maxlength="500"></textarea>
        <button type="submit" id="contact-main-form-btn">
          Submit <i class="fa-solid fa-paper-plane"></i>
        </button>
        </form>
      </div>
    </main>
    <!-- end contact main section -->
    <!-- footer including -->
    <footer id="footer-container"></footer>
    <!-- for the footer and header to work -->
    <script src="js/theme.js"></script>
    <script src="js/home.js"></script>
  </body>
</html>
