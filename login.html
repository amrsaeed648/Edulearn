<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edulearn - Login</title>
    
    <!-- Team's Global Styles -->
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    
    <!-- Team's Header & Footer Styles -->
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    
    <!-- Team's Icons (FontAwesome) -->
    <link rel="stylesheet" href="Css/all.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <!-- Your Icons (Boxicons) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- YOUR CSS MUST GO LAST -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <!-- 1. ADDED: Team Global Header Placeholder -->
    <div id="header-container"></div>

    <div class="background"></div>
    
    <div class="container">
        <div class="content">
            <h2 class="logo"><i class='bx bxl-firebase'></i>Login</h2>

            <div class="text-sci">
                <h2>Welcome<br><span>To Our Website!</span></h2>
            </div>
        </div>

        <div class="logreg-box">
            <div class="form-box login">
                <form action="#">
                    <h2>Login</h2>

                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-envelope' ></i></span>
                        <input type="email" id="login-email" required>
                        <label>Email</label>
                    </div>

                    <div class="input-box">
                        <span class="icon"><i class='bx bxs-lock-alt' ></i></span>
                        <input type="password" id="login-pass" required>
                        <label>Password</label>
                    </div>

                    <div class="remember-forgot">
                        <label><input type="checkbox">Remember me</label>
                        <a href="#">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn">Login</button>

                    <div class="login-register">
                        <p>Don't have an account? <a href="#" class="register-link">Sign Up</a></p>
                    </div>
                </form>
            </div>  

            <div class="form-box register">
                <form action="#">
                <h2>Sign Up</h2>

                <div class="input-box">
                    <input type="text" id="reg-name" required>
                    <label>Username</label>
                    <i class='bx bxs-user icon'></i>
                </div>

                <div class="input-box">
                    <input type="email" id="reg-email" placeholder="Must end with @gmail.com" required>
                    <label>Email</label>
                    <i class='bx bxs-envelope icon'></i>
                </div>

                <div class="input-box">
                    <input type="password" id="reg-pass" placeholder="8+ chars, 1 upper, 1 num, 1 symbol" required>
                    <label>Password</label>
                    <i class='bx bxs-lock-alt icon'></i>
                </div>

                <div class="remember-forgot">
                    <label><input type="checkbox" id="terms-check"> I agree to the terms & conditions</label>
                </div>

                    <p id="reg-error"></p>
                    <button type="submit" class="btn">Sign Up</button>

                    <div class="login-register">
                        <p>Already have an account? <a href="#" class="login-link">Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. FIXED: Kept only one footer container -->
    <footer id="footer-container"></footer>

    <!-- Team's Custom Scripts -->
    <script src="js/theme.js"></script>
    <script src="js/home.js"></script>

    <!-- Team's Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    
    <!-- Your Login JS -->
    <script src="js/login.js"></script>   
</body>
</html>
